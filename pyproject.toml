[project]
name = "cat-extractor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber",
    "google-generativeai",
    "pydantic",
    "python-dotenv",
    "google-genai>=1.73.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
